name: CS149 Assignment2 Part B
on:
  push:
    branches: [edidada/part-b]
  workflow_dispatch:
jobs:
  dag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Original build and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          lscpu > evidence/cpu.txt
          make -C part_b
          g++ -O3 -std=c++11 -pthread -Ipart_b -Icommon -Itests tests/part_b_original.cpp part_b/tasksys.cpp -o /tmp/original
          for i in $(seq 0 28); do
            timeout 120 /tmp/original "$i" | tee "evidence/original-$i.log"
          done
      - name: Sanitized custom DAG boundaries
        shell: bash
        run: |
          set -euo pipefail
          g++ -g -O1 -std=c++11 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Ipart_b tests/part_b_boundaries.cpp part_b/tasksys.cpp -o /tmp/boundaries
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 timeout 180 /tmp/boundaries | tee evidence/boundaries.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-b-evidence
          path: evidence
